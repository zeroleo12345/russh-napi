name: Publish to npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # tag format: vX.X.X

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - name: Bump version in package.json
        run: |
          npm version ${{ github.ref_name }} --no-git-tag-version

      # setup OIDC between NPMJS.com and Github Action, can set it in NPM repo Settings
      - name: Publish to npm
        run: |
          npm publish --provenance --access public
